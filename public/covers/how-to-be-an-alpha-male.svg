<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 700"
     role="img"
     aria-label="Canvix Store digital PDF book purchasing process">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080808"/>
      <stop offset="55%" stop-color="#181512"/>
      <stop offset="100%" stop-color="#30261c"/>
    </linearGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4d28b"/>
      <stop offset="45%" stop-color="#c89443"/>
      <stop offset="100%" stop-color="#f1c875"/>
    </linearGradient>

    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#211c17"/>
      <stop offset="100%" stop-color="#100f0d"/>
    </linearGradient>

    <radialGradient id="glow" cx="70%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#d6a15b" stop-opacity=".18"/>
      <stop offset="60%" stop-color="#8c652f" stop-opacity=".05"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>

    <filter id="shadow">
      <feDropShadow dx="0" dy="10" stdDeviation="14"
                    flood-color="#000000" flood-opacity=".55"/>
    </filter>
  </defs>

  <!-- ========================= -->
  <!-- BACKGROUND -->
  <!-- ========================= -->

  <rect width="1200" height="700" fill="url(#bg)"/>
  <rect width="1200" height="700" fill="url(#glow)"/>

  <!-- Border -->
  <rect x="25" y="25"
        width="1150" height="650"
        rx="8"
        fill="none"
        stroke="#8f672f"
        stroke-width="1"/>

  <rect x="35" y="35"
        width="1130" height="630"
        rx="6"
        fill="none"
        stroke="#d6a15b"
        stroke-width=".5"
        opacity=".45"/>


  <!-- ========================= -->
  <!-- BRAND -->
  <!-- ========================= -->

  <g transform="translate(75 72)">

    <!-- Crown -->
    <path d="
      M0 30
      L9 6
      L27 23
      L44 0
      L61 23
      L79 6
      L88 30
      Z"
      fill="url(#gold)"/>

    <rect x="7"
          y="30"
          width="74"
          height="8"
          rx="3"
          fill="url(#gold)"/>

  </g>

  <text x="190"
        y="98"
        fill="url(#gold)"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="31"
        font-weight="bold"
        letter-spacing="5">
    CANVIX
  </text>

  <text x="192"
        y="124"
        fill="#bcae9d"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="15"
        letter-spacing="7">
    STORE
  </text>


  <!-- ========================= -->
  <!-- MAIN HEADING -->
  <!-- ========================= -->

  <text x="70"
        y="205"
        fill="#f7f3ec"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="43"
        font-weight="bold">
    Digital Books.
  </text>

  <text x="70"
        y="255"
        fill="url(#gold)"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="43"
        font-weight="bold">
    Delivered Personally.
  </text>

  <text x="72"
        y="290"
        fill="#aaa199"
        font-family="Arial, sans-serif"
        font-size="16">
    Choose your book, complete your payment,
  </text>

  <text x="72"
        y="315"
        fill="#aaa199"
        font-family="Arial, sans-serif"
        font-size="16">
    and our team will verify and deliver it to your Gmail.
  </text>


  <!-- ========================= -->
  <!-- STEP 1 -->
  <!-- ========================= -->

  <g filter="url(#shadow)">

    <rect x="60"
          y="355"
          width="200"
          height="190"
          rx="12"
          fill="url(#card)"
          stroke="#60482a"
          stroke-width="1"/>

    <circle cx="100"
            cy="395"
            r="23"
            fill="#17120d"
            stroke="url(#gold)"
            stroke-width="1.5"/>

    <text x="100"
          y="402"
          text-anchor="middle"
          fill="url(#gold)"
          font-family="Arial, sans-serif"
          font-size="18"
          font-weight="bold">
      01
    </text>

    <!-- Book icon -->
    <path d="
      M90 435
      Q105 428 120 438
      Q135 428 150 435
      L150 480
      Q135 472 120 482
      Q105 472 90 480
      Z"
      fill="none"
      stroke="#d6a15b"
      stroke-width="2"/>

    <line x1="120"
          y1="437"
          x2="120"
          y2="481"
          stroke="#d6a15b"
          stroke-width="1.5"/>

    <text x="80"
          y="515"
          fill="#f5efe7"
          font-family="Arial, sans-serif"
          font-size="16"
          font-weight="bold">
      Choose a Book
    </text>

    <text x="80"
          y="535"
          fill="#918a82"
          font-family="Arial, sans-serif"
          font-size="12">
      Browse our PDF books
    </text>

  </g>


  <!-- ========================= -->
  <!-- ARROW -->
  <!-- ========================= -->

  <path d="
    M270 450
    L300 450"
    stroke="#c89443"
    stroke-width="2"/>

  <path d="
    M294 444
    L301 450
    L294 456"
    fill="none"
    stroke="#c89443"
    stroke-width="2"/>


  <!-- ========================= -->
  <!-- STEP 2 -->
  <!-- ========================= -->

  <g filter="url(#shadow)">

    <rect x="315"
          y="355"
          width="200"
          height="190"
          rx="12"
          fill="url(#card)"
          stroke="#60482a"
          stroke-width="1"/>

    <circle cx="355"
            cy="395"
            r="23"
            fill="#17120d"
            stroke="url(#gold)"
            stroke-width="1.5"/>

    <text x="355"
          y="402"
          text-anchor="middle"
          fill="url(#gold)"
          font-family="Arial, sans-serif"
          font-size="18"
          font-weight="bold">
      02
    </text>

    <!-- Payment icon -->
    <rect x="355"
          y="430"
          width="70"
          height="45"
          rx="6"
          fill="#17120d"
          stroke="#d6a15b"
          stroke-width="2"/>

    <line x1="355"
          y1="443"
          x2="425"
          y2="443"
          stroke="#d6a15b"
          stroke-width="1.5"/>

    <rect x="365"
          y="455"
          width="22"
          height="5"
          rx="2"
          fill="#c89443"/>

    <text x="335"
          y="515"
          fill="#f5efe7"
          font-family="Arial, sans-serif"
          font-size="16"
          font-weight="bold">
      Make Payment
    </text>

    <text x="335"
          y="535"
          fill="#918a82"
          font-family="Arial, sans-serif"
          font-size="12">
      Follow the payment info
    </text>

  </g>


  <!-- ========================= -->
  <!-- ARROW -->
  <!-- ========================= -->

  <path d="
    M525 450
    L555 450"
    stroke="#c89443"
    stroke-width="2"/>

  <path d="
    M549 444
    L556 450
    L549 456"
    fill="none"
    stroke="#c89443"
    stroke-width="2"/>


  <!-- ========================= -->
  <!-- STEP 3 -->
  <!-- ========================= -->

  <g filter="url(#shadow)">

    <rect x="570"
          y="355"
          width="200"
          height="190"
          rx="12"
          fill="url(#card)"
          stroke="#60482a"
          stroke-width="1"/>

    <circle cx="610"
            cy="395"
            r="23"
            fill="#17120d"
            stroke="url(#gold)"
            stroke-width="1.5"/>

    <text x="610"
          y="402"
          text-anchor="middle"
          fill="url(#gold)"
          font-family="Arial, sans-serif"
          font-size="18"
          font-weight="bold">
      03
    </text>

    <!-- Form icon -->
    <rect x="610"
          y="425"
          width="65"
          height="60"
          rx="4"
          fill="#17120d"
          stroke="#d6a15b"
          stroke-width="2"/>

    <line x1="620"
          y1="440"
          x2="660"
          y2="440"
          stroke="#c89443"
          stroke-width="2"/>

    <line x1="620"
          y1="452"
          x2="660"
          y2="452"
          stroke="#8d7047"
          stroke-width="2"/>

    <line x1="620"
          y1="464"
          x2="650"
          y2="464"
          stroke="#8d7047"
          stroke-width="2"/>

    <path d="
      M650 474
      L655 479
      L665 467"
      fill="none"
      stroke="#d6a15b"
      stroke-width="2"/>

    <text x="590"
          y="515"
          fill="#f5efe7"
          font-family="Arial, sans-serif"
          font-size="16"
          font-weight="bold">
      Submit Order
    </text>

    <text x="590"
          y="535"
          fill="#918a82"
          font-family="Arial, sans-serif"
          font-size="12">
      Provide payment details
    </text>

  </g>


  <!-- ========================= -->
  <!-- ARROW -->
  <!-- ========================= -->

  <path d="
    M780 450
    L810 450"
    stroke="#c89443"
    stroke-width="2"/>

  <path d="
    M804 444
    L811 450
    L804 456"
    fill="none"
    stroke="#c89443"
    stroke-width="2"/>


  <!-- ========================= -->
  <!-- STEP 4 -->
  <!-- ========================= -->

  <g filter="url(#shadow)">

    <rect x="825"
          y="355"
          width="300"
          height="190"
          rx="12"
          fill="url(#card)"
          stroke="#60482a"
          stroke-width="1"/>

    <circle cx="865"
            cy="395"
            r="23"
            fill="#17120d"
            stroke="url(#gold)"
            stroke-width="1.5"/>

    <text x="865"
          y="402"
          text-anchor="middle"
          fill="url(#gold)"
          font-family="Arial, sans-serif"
          font-size="18"
          font-weight="bold">
      04
    </text>

    <!-- Gmail / envelope -->
    <rect x="865"
          y="430"
          width="80"
          height="55"
          rx="6"
          fill="#17120d"
          stroke="#d6a15b"
          stroke-width="2"/>

    <path d="
      M867 434
      L905 462
      L943 434"
      fill="none"
      stroke="#d6a15b"
      stroke-width="2"/>

    <!-- Check mark -->
    <circle cx="965"
            cy="470"
            r="18"
            fill="#17120d"
            stroke="#c89443"
            stroke-width="2"/>

    <path d="
      M956 470
      L963 477
      L975 463"
      fill="none"
      stroke="#d6a15b"
      stroke-width="2"/>

    <text x="845"
          y="515"
          fill="#f5efe7"
          font-family="Arial, sans-serif"
          font-size="16"
          font-weight="bold">
      Verification &amp; Delivery
    </text>

    <text x="845"
          y="535"
          fill="#918a82"
          font-family="Arial, sans-serif"
          font-size="12">
      Canvix Team verifies and emails
    </text>

  </g>


  <!-- ========================= -->
  <!-- FINAL MESSAGE -->
  <!-- ========================= -->

  <line x1="100"
        y1="590"
        x2="1100"
        y2="590"
        stroke="#6d502c"
        stroke-width="1"/>

  <text x="600"
        y="625"
        text-anchor="middle"
        fill="#f1eadf"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="19">
    Your PDF will be sent to your provided Gmail address.
  </text>

  <text x="600"
        y="650"
        text-anchor="middle"
        fill="url(#gold)"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="14"
        letter-spacing="5">
    CANVIX STORE • DIGITAL KNOWLEDGE
  </text>

</svg>